<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Victory Pickle Booking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .slot-card {
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .available {
      background-color: #d4edda;
    }
    .booked {
      background-color: #f8d7da;
    }
  </style>
</head>

<body class="bg-light">

<div class="container py-4">

  <h3 class="text-center mb-4">🏓 Victory Pickle Court Booking</h3>

  <!-- Date Picker -->
  <div class="mb-3 text-center">
    <input type="date" id="selected-date" class="form-control w-50 mx-auto">
  </div>

  <!-- Slots -->
  <div id="slots-container"></div>

</div>

<script>
const SHEET_URL = "https://opensheet.elk.sh/1dE5PSsXpn1gnS0H1Okfwz0xQ7xCFdDeo3iNo08TL-mg/Sheet1";
const PHONE = "919994868106";

let allData = [];

// fetch data
fetch(SHEET_URL)
  .then(res => res.json())
  .then(data => {
    allData = data;
    setToday();
  });

// convert DD/MM/YYYY → YYYY-MM-DD
function formatDate(input) {
  if (input.includes("-")) return input;

  const [day, month, year] = input.split("/");
  return `${year}-${month.padStart(2, "0")}-${day.padStart(2, "0")}`;
}

// today (IST safe)
function setToday() {
  const today = new Date().toLocaleDateString("en-CA");
  document.getElementById("selected-date").value = today;
  renderSlots(today);
}

// date change
document.getElementById("selected-date").addEventListener("change", function () {
  renderSlots(this.value);
});

// main render
function renderSlots(date) {
  const container = document.getElementById("slots-container");
  container.innerHTML = "";

  const filtered = allData.filter(row => formatDate(row.date) === date);

  if (filtered.length === 0) {
    container.innerHTML = "<p class='text-center'>No slots found</p>";
    return;
  }

  // current time
  const now = new Date();
  const currentHour = now.getHours();

  function getSlotHour(slotTime) {
    let hour = parseInt(slotTime);

    if (slotTime.toLowerCase().includes("pm") && hour !== 12) {
      hour += 12;
    }
    if (slotTime.toLowerCase().includes("am") && hour === 12) {
      hour = 0;
    }

    return hour;
  }

  // split groups
  const morning = [];
  const evening = [];

  filtered.forEach(slot => {
    if (slot.time.toLowerCase().includes("am")) {
      morning.push(slot);
    } else {
      evening.push(slot);
    }
  });

  function renderGroup(title, slots) {
    if (slots.length === 0) return "";

    let html = `<h5 class="mt-3">${title}</h5>`;

    slots.forEach(slot => {
      const isBooked = slot.status.toLowerCase() === "booked";

      const slotHour = getSlotHour(slot.time);

      const isPast =
        formatDate(date) === new Date().toLocaleDateString("en-CA") &&
        // slotHour <= currentHour;
        slotHour < currentHour

      let btn = "";

      if (isPast) {
        btn = `<span class="badge bg-secondary">Closed</span>`;
      } else if (!isBooked) {
        const message = encodeURIComponent(
          `Hi, I want to book ${slot.time} on ${date} at Victory Pickle Court`
        );

        btn = `
          <a href="https://wa.me/${PHONE}?text=${message}"
             class="btn btn-success btn-sm">
             Book
          </a>
        `;
      } else {
        btn = `<span class="badge bg-danger">Booked</span>`;
      }

      html += `
        <div class="slot-card ${isBooked ? "booked" : "available"} d-flex justify-content-between align-items-center">
          <div>
            <strong>${slot.time}</strong><br>
            <small>${
              isPast ? "Closed" : isBooked ? "Not Available" : "Available"
            }</small>
          </div>
          <div>${btn}</div>
        </div>
      `;
    });

    return html;
  }

  container.innerHTML =
    renderGroup("🌅 Morning (6AM–10AM)", morning) +
    renderGroup("🌙 Evening (4PM–11PM)", evening);
}
</script>

</body>
</html>
